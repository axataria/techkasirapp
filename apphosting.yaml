# Keep the custom server: API requests, invoices and Next.js share one origin.
scripts:
  buildCommand: npm run build
  runCommand: npm start

runConfig:
  minInstances: 0
  maxInstances: 1
  concurrency: 10
  cpu: 1
  memoryMiB: 1024

outputFiles:
  serverApp:
    include:
      - .next
      - node_modules
      - server.mjs
      - src
      - shared
      - scripts/database/supabase-ca.crt
      - next.config.ts
      - package.json
      - package-lock.json

env:
  - variable: HOST
    value: 0.0.0.0
    availability: [RUNTIME]
  - variable: TECHKASIR_REQUIRE_POSTGRES
    value: "true"
    availability: [RUNTIME]
  - variable: DATABASE_URL
    secret: techkasir-database-url
    availability: [RUNTIME]
  - variable: TECHKASIR_APP_ORIGIN
    value: https://kasirlaptoplab.web.app
    availability: [RUNTIME]
